name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate JavaScript
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Reject private conversation or credential material
        run: npm run privacy
      - name: Check shell syntax
        run: bash -n install.sh doctor.sh uninstall.sh
